# CI-1 — four parallel jobs (api / web / mobile / bs-calendar) + all-green gate.
# See docs/ci/README.md for what runs, why, and the branch-protection setup.
#
# Non-workspace monorepo: each package has its own package-lock.json and is
# npm-ci'd in its own directory. packages/bs-calendar/dist is NOT committed, so
# jobs whose typecheck or module resolution points at it (api, mobile) build it
# first.

name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    env:
      # The 298-test baseline has always run under Nepal time; two
      # import.service tests fail under the runner's UTC (BS→AD conversion
      # uses local-time Date components — see FIX-2 in CLAUDE.md dev-notes).
      TZ: Asia/Kathmandu
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            packages/bs-calendar/package-lock.json
      - name: Build bs-calendar (api's tsconfig path alias resolves to its dist/)
        working-directory: packages/bs-calendar
        run: |
          npm ci
          npm run build
      - name: Install
        run: npm ci
      # A fresh install ships an ungenerated @prisma/client stub — without this,
      # typecheck fails with ~90 TS2347 errors on $queryRawUnsafe<T>() calls.
      - name: Generate Prisma client
        run: npx prisma generate
      # Plain `tsc --noEmit` fails on TS6059 (test/ outside rootDir) — the build
      # config is the clean typecheck. See docs/ci/README.md.
      - name: Typecheck (src)
        run: npx tsc -p tsconfig.build.json --noEmit
      # tsconfig.build.json excludes **/*spec.ts, and ts-jest reports diagnostics
      # only for the file it is transforming — measured, a type error in a SRC
      # file passes jest and is caught by the step above, while one in a SPEC
      # file does the reverse. Neither covers both, so both run. Without this
      # step spec type-safety rests entirely on ts-jest's default diagnostics,
      # which any future `isolatedModules: true` would silently remove.
      - name: Typecheck (specs)
        run: npx tsc -p tsconfig.spec.json --noEmit
      - name: Unit tests (baseline 298 — informational; the gate is the exit code)
        run: npm test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          # No npm cache here (unlike api/mobile) — apps/web's bs-calendar
          # dependency is a freshly-regenerated LOCAL tarball on every
          # install (see the "Vendor bs-calendar" step below), never
          # actually fetched from the registry, so there's nothing worth
          # caching for it — and an npm-cache restore from a prior run has
          # been observed to serve a stale/corrupted blob for that exact
          # tarball path ("seems to be corrupted, trying again" → ENOENT),
          # which a warm cache then perpetuates on every subsequent run.
      # Explicit step (matches the api/mobile jobs' pattern of building
      # their bs-calendar dependency as its own named step) rather than
      # relying on apps/web's `preinstall` npm lifecycle hook to produce
      # the tarball in time — that implicit ordering is what raced and
      # failed here.
      - name: Vendor bs-calendar (produces apps/web/vendor/bs-calendar.tgz)
        working-directory: .
        run: node scripts/vendor-bs-calendar.mjs
      # NEITHER `npm ci` NOR plain `npm install` is sufficient here — both
      # enforce package-lock.json's EXISTING pinned integrity hash for an
      # already-declared `file:` dependency and fail (EINTEGRITY) rather
      # than silently re-hashing it. Confirmed empirically this is a genuine
      # PLATFORM difference, not run-to-run randomness: this exact repo
      # reliably produces one sha512 for apps/web/vendor/bs-calendar.tgz on
      # Windows and a different, but ALSO internally consistent, sha512 on
      # Linux CI runners (npm/tar embeds platform-specific metadata such as
      # file-mode bits) — so whichever platform's hash happens to be pinned
      # in the lockfile, the OTHER platform's fresh build will never match
      # it. The only thing that works is the EXPLICIT named re-resolution
      # `scripts/vendor-bs-calendar.mjs`'s own header comment already
      # documents as required after any packages/bs-calendar change — naming
      # the exact spec forces npm to re-hash against what THIS build just
      # produced instead of trusting the lockfile's stale pin. This single
      # command installs the full dependency tree, not just bs-calendar
      # (confirmed: same package count as a plain install).
      - name: Install
        run: npm install bs-calendar@file:./vendor/bs-calendar.tgz
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test placeholder
        run: echo "no test runner configured (known gap)"

  mobile:
    runs-on: ubuntu-latest
    env:
      # Tests are timezone-sensitive by design (BS calendar). The npm script
      # already pins TZ via cross-env; this is belt-and-braces for any future
      # script that forgets.
      TZ: Asia/Kathmandu
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            apps/mobile/package-lock.json
            packages/bs-calendar/package-lock.json
      - name: "Build bs-calendar (file: dependency's main points at its dist/)"
        working-directory: packages/bs-calendar
        run: |
          npm ci
          npm run build
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Tests (jest-expo, TZ=Asia/Kathmandu)
        run: npm test

  bs-calendar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/bs-calendar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: packages/bs-calendar/package-lock.json
      - name: Install
        run: npm ci
      - name: Build (doubles as typecheck)
        run: npm run build
      - name: Tests
        run: npm test

  # The single required status check for branch protection (docs/ci/README.md).
  # If any needed job fails this one is skipped, which also blocks the merge.
  all-green:
    needs: [api, web, mobile, bs-calendar]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All CI jobs green."
